<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts visible to Wine inside QEMU's private, non-chrooted runtime. -->
<fontconfig>
  <dir>/usr/share/wine/fonts</dir>

  <alias binding="same">
    <family>Calibri</family>
    <accept><family>Carlito</family></accept>
  </alias>
  <alias binding="same">
    <family>Segoe UI</family>
    <accept><family>Carlito</family></accept>
  </alias>

  <!-- The XWD surface can be rescaled by the Vinix window manager. Grayscale
       antialiasing remains stable under that transform; LCD subpixel colour
       fringes do not. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
  </match>
</fontconfig>
