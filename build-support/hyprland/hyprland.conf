# Vinix framebuffer session. The patched Aquamarine backend publishes this
# fixed output from FBIOGET_VSCREENINFO and copies each completed GBM frame to
# /dev/fb0.
monitor = Vinix-1, preferred, auto, 1

$mainMod = SUPER
bind = $mainMod, RETURN, exec, foot
bind = $mainMod, Q, killactive
bind = $mainMod, M, exit
bind = $mainMod, F, fullscreen
bind = $mainMod, SPACE, togglefloating
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

input {
    kb_layout = us
    follow_mouse = 1
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

xwayland {
    enabled = false
}

misc {
    disable_splash_rendering = true
    disable_hyprland_logo = true
    background_color = rgb(101418)
    force_default_wallpaper = 0
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

# Monitor setup runs before Hyprland exports its socket name. Seed the initial
# client explicitly; later key bindings inherit WAYLAND_DISPLAY from Hyprland.
exec-once = /bin/busybox env WAYLAND_DISPLAY=wayland-1 foot
