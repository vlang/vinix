<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <include ignore_missing="no">fonts.conf</include>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>serif</family><prefer><family>Roboto</family></prefer></alias>
  <alias binding="strong"><family>monospace</family><prefer><family>Roboto Mono</family></prefer></alias>
</fontconfig>
