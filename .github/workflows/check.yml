name: Build Vinix kernel

on:
  pull_request:
    paths-ignore:
      - "**.md"
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "**.md"

jobs:
  vinix-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      V_C_ERROR_BUG_REPORT_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
        id: uses_checkout_v7

      - name: Install dependencies
        id: install_dependencies
        if: ${{ success() && !cancelled() && steps.uses_checkout_v7.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install build-essential clang -y

      # A fixed V, not the current one: the kernel is written against one
      # compiler's strictness, and a floating V turns every upstream V change
      # into a red build here. tools/m1-wifi/get-v.sh pins V and its bootstrap
      # compiler and is what the Wi-Fi build already uses. Bump the pin there.
      - name: Build the pinned V
        id: build_the_pinned_v
        if: ${{ success() && !cancelled() && steps.install_dependencies.outcome == 'success' }}
        run: sh tools/m1-wifi/get-v.sh "$PWD/v"

      # Userland utilities use the release compiler's libc bindings. The
      # kernel compiler is pinned separately for its freestanding backend.
      - name: Fetch the pinned utility compiler
        id: fetch_the_pinned_utility_compiler
        if: ${{ success() && !cancelled() && steps.build_the_pinned_v.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://github.com/vlang/v/releases/download/0.5.2/v_linux.zip \
            -o "$RUNNER_TEMP/v_util_linux.zip"
          echo "86caf9e70c3342d48ef19eb4f6c47b709f18c90ae86255520d5c29df6b482e23  $RUNNER_TEMP/v_util_linux.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/v-util"
          unzip -q "$RUNNER_TEMP/v_util_linux.zip" -d "$RUNNER_TEMP/v-util"
          chmod +x "$RUNNER_TEMP/v-util/v/v"
          "$RUNNER_TEMP/v-util/v/v" version

      - name: Download kernel dependencies
        id: download_kernel_dependencies
        if: ${{ success() && !cancelled() && steps.fetch_the_pinned_utility_compiler.outcome == 'success' }}
        run: cd kernel && ./get-deps

      - name: Attempt to build the Vinix kernel (debug)
        id: attempt_to_build_the_vinix_kernel_debug
        if: ${{ success() && !cancelled() && steps.download_kernel_dependencies.outcome == 'success' }}
        run: |
          set -e
          cd kernel
          make PROD=false \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../v/v)"
          make clean

      - name: Attempt to build the Vinix kernel (prod)
        id: attempt_to_build_the_vinix_kernel_prod
        if: ${{ success() && !cancelled() && steps.attempt_to_build_the_vinix_kernel_debug.outcome == 'success' }}
        run: |
          set -e
          cd kernel
          make PROD=true \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$(realpath ../v/v)"
          make clean

      - name: Attempt to build the util-vinix (debug)
        id: attempt_to_build_the_util_vinix_debug
        if: ${{ success() && !cancelled() && steps.attempt_to_build_the_vinix_kernel_prod.outcome == 'success' }}
        run: |
          set -e
          export VEXE="$RUNNER_TEMP/v-util/v/v"
          cd util-vinix
          make PROD=false \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$VEXE"
          make clean

      - name: Attempt to build the util-vinix (prod)
        id: attempt_to_build_the_util_vinix_prod
        if: ${{ success() && !cancelled() && steps.attempt_to_build_the_util_vinix_debug.outcome == 'success' }}
        run: |
          set -e
          export VEXE="$RUNNER_TEMP/v-util/v/v"
          cd util-vinix
          make PROD=true \
            VFLAGS="-os vinix -gc none" \
            CFLAGS="-Ulinux -U__linux -U__linux__ -U__gnu_linux__ -D__vinix__ -O2 -g -pipe" \
            V="$VEXE"
          make clean
