name: Desktop i18n integration

on:
  push:
    branches:
      - desktop-i18n-en-ru
    paths:
      - '.github/workflows/desktop-i18n-bootstrap.yml'

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'ci: apply desktop i18n integration patches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: desktop-i18n-en-ru
          fetch-depth: 0

      - name: Apply localization integration patches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f'{path}: expected at least {count} occurrence(s), found {actual}: {old[:80]!r}')
              text = text.replace(old, new, count)
              p.write_text(text)

          # Carry SystemLanguage through the native-app/compositor protocol.
          p = Path('desktop/app_process.v')
          text = p.read_text()
          text = text.replace('const app_protocol_version = u8(5)\nconst app_request_header_size = 124\nconst app_response_header_size = 116',
                              'const app_protocol_version = u8(6)\nconst app_request_header_size = 128\nconst app_response_header_size = 120')
          text = text.replace('wire_put_i32(mut out, int(state.settings.theme))\n\twire_put_i32(mut out, if state.settings.clock_24_hour',
                              'wire_put_i32(mut out, int(state.settings.theme))\n\twire_put_i32(mut out, int(state.settings.language))\n\twire_put_i32(mut out, if state.settings.clock_24_hour', 1)
          text = text.replace('theme := reader.take_i32()!\n\tclock_24_hour := reader.take_i32()!',
                              'theme := reader.take_i32()!\n\tlanguage := reader.take_i32()!\n\tclock_24_hour := reader.take_i32()!', 1)
          text = text.replace('|| theme < int(ThemeKind.default_) || theme > int(ThemeKind.macos)\n\t\t|| clock_24_hour',
                              '|| theme < int(ThemeKind.default_) || theme > int(ThemeKind.macos)\n\t\t|| language < int(SystemLanguage.en) || language > int(SystemLanguage.ru)\n\t\t|| clock_24_hour', 1)
          text = text.replace('\t\t\ttheme: unsafe { ThemeKind(theme) }\n\t\t\tclock_24_hour:',
                              '\t\t\ttheme: unsafe { ThemeKind(theme) }\n\t\t\tlanguage: unsafe { SystemLanguage(language) }\n\t\t\tclock_24_hour:', 1)
          old = '''fn apply_app_state(mut desktop Desktop, state AppWireState) {
\twallpaper_changed := desktop.settings.wallpaper_color != state.settings.wallpaper_color
\t\t|| desktop.settings.wallpaper_image != state.settings.wallpaper_image
\tclock_changed := desktop.settings.clock_24_hour != state.settings.clock_24_hour
\t\t|| desktop.settings.clock_show_seconds != state.settings.clock_show_seconds
\t\t|| desktop.settings.clock_show_date != state.settings.clock_show_date
\t\t|| desktop.settings.clock_show_weekday != state.settings.clock_show_weekday
\tdesktop.settings = state.settings
\tdesktop.accept_capture_request(state.capture_request)
\tif wallpaper_changed {
\t\tdesktop.invalidate_wallpaper()
\t}
\tif clock_changed {
\t\tdesktop.taskbar_clock_sampled = false
\t\tdesktop.dirty = true
\t}
'''
          new = '''fn apply_app_state(mut desktop Desktop, state AppWireState) {
\twallpaper_changed := desktop.settings.wallpaper_color != state.settings.wallpaper_color
\t\t|| desktop.settings.wallpaper_image != state.settings.wallpaper_image
\tlanguage_changed := desktop.settings.language != state.settings.language
\tclock_changed := desktop.settings.clock_24_hour != state.settings.clock_24_hour
\t\t|| desktop.settings.clock_show_seconds != state.settings.clock_show_seconds
\t\t|| desktop.settings.clock_show_date != state.settings.clock_show_date
\t\t|| desktop.settings.clock_show_weekday != state.settings.clock_show_weekday
\tdesktop.settings = state.settings
\tdesktop_i18n_set_language(state.settings.language)
\tdesktop.accept_capture_request(state.capture_request)
\tif wallpaper_changed {
\t\tdesktop.invalidate_wallpaper()
\t}
\tif clock_changed || language_changed {
\t\tdesktop.taskbar_clock_sampled = false
\t\tdesktop.dirty = true
\t}
'''
          if old not in text:
              raise SystemExit('desktop/app_process.v: apply_app_state block did not match')
          text = text.replace(old, new, 1)
          text = text.replace('\t\tdesktop.settings = state.settings\n\t\tdesktop.capture.request = state.capture_request',
                              '\t\tdesktop.settings = state.settings\n\t\tdesktop_i18n_set_language(state.settings.language)\n\t\tdesktop.capture.request = state.capture_request', 1)
          p.write_text(text)

          # Translate ui2 interface text at the compositor renderer boundary.
          p = Path('desktop/render.v')
          text = p.read_text()
          text = text.replace('fn (mut d Desktop) render_clipped(root ui2.Element, clip Clip) {\n\t// clear()',
                              'fn (mut d Desktop) render_clipped(root ui2.Element, clip Clip) {\n\tdesktop_i18n_set_language(d.settings.language)\n\t// clear()', 1)
          text = text.replace('''\tface := d.face_for(el.text_style)
\ttext, text_owned := face.truncate(el.text, w)
''', '''\tface := d.face_for(el.text_style)
\tsource_text := if el.id == desktop_i18n_raw_text_id { el.text } else { desktop_i18n_text(el.text) }
\ttext, text_owned := face.truncate(source_text, w)
''', 1)
          old = '''\tface := d.face_for(el.text_style)
\tinner := if el.text_style.align == .center && el.image_path.len == 0 { w } else { text_w }
\ttext, text_owned := face.truncate(el.text, inner)
'''
          new = '''\tface := d.face_for(el.text_style)
\tinner := if el.text_style.align == .center && el.image_path.len == 0 { w } else { text_w }
\tsource_text := if el.id == desktop_i18n_raw_text_id { el.text } else { desktop_i18n_text(el.text) }
\ttext, text_owned := face.truncate(source_text, inner)
'''
          if old not in text:
              raise SystemExit('desktop/render.v: draw_button text block did not match')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Add a macOS-inspired Language & Region pane, still using ui2.
          p = Path('desktop/settings_app.v')
          text = p.read_text()
          text = text.replace('''enum SettingsCategory {
\tappearance
\tdate_time
''', '''enum SettingsCategory {
\tappearance
\tlanguage_region
\tdate_time
''', 1)
          text = text.replace('''const settings_categories = [SettingsCategory.appearance, .date_time, .theme, .wallpaper, .wifi,
\t.display, .battery]
''', '''const settings_categories = [SettingsCategory.appearance, .language_region, .date_time, .theme,
\t.wallpaper, .wifi, .display, .battery]
''', 1)
          old = '''fn (c SettingsCategory) title() string {
\treturn match c {
\t\t.appearance { 'Appearance' }
\t\t.date_time { 'Date & Time' }
\t\t.theme { 'Theme' }
\t\t.wallpaper { 'Wallpaper' }
\t\t.wifi { 'Wi-Fi' }
\t\t.display { 'Display' }
\t\t.battery { 'Battery' }
\t}
}
'''
          new = '''fn (c SettingsCategory) title() string {
\treturn match c {
\t\t.appearance { desktop_tr('settings.category.appearance') }
\t\t.language_region { desktop_tr('settings.category.language_region') }
\t\t.date_time { desktop_tr('settings.category.date_time') }
\t\t.theme { desktop_tr('settings.category.theme') }
\t\t.wallpaper { desktop_tr('settings.category.wallpaper') }
\t\t.wifi { desktop_tr('settings.category.wifi') }
\t\t.display { desktop_tr('settings.category.display') }
\t\t.battery { desktop_tr('settings.category.battery') }
\t}
}
'''
          if old not in text:
              raise SystemExit('settings_app title block did not match')
          text = text.replace(old, new, 1)
          text = text.replace("const settings_action_taskbar = 'settings.taskbar.'\n",
                              "const settings_action_taskbar = 'settings.taskbar.'\nconst settings_action_language = 'settings.language.'\n", 1)
          text = text.replace('''\treturn match a.category {
\t\t.appearance { a.appearance_pane(width) }
\t\t.date_time { a.date_time_pane(width) }
''', '''\treturn match a.category {
\t\t.appearance { a.appearance_pane(width) }
\t\t.language_region { a.language_region_pane(width) }
\t\t.date_time { a.date_time_pane(width) }
''', 1)
          marker = 'fn (a &SettingsApp) date_time_pane(width int) []ui2.Element {'
          pane = r'''fn (a &SettingsApp) language_region_pane(width int) []ui2.Element {
\tsettings := a.desktop.settings
\tinner := width - 2 * settings_padding
\thalf := (inner - settings_row_gap) / 2

\tmut out := frame_elements(9)
\tmut y := settings_padding
\tout << settings_heading(desktop_tr('settings.language.title'), y, width)
\ty += 22
\tout << settings_note(desktop_tr('settings.language.note'), y, width)
\ty += 22
\tout << settings_choice('${settings_action_language}0', desktop_tr('settings.language.english'), settings_padding, y, half, settings.language == .en)
\tout << settings_choice('${settings_action_language}1', desktop_tr('settings.language.russian'), settings_padding + half + settings_row_gap, y, half, settings.language == .ru)
\ty += 28 + 8
\tout << settings_note(desktop_tr('settings.language.immediate'), y, width)
\ty += 16 + 22

\tout << settings_heading(desktop_tr('settings.region.title'), y, width)
\ty += 22
\tout << settings_note(desktop_tr('settings.region.note'), y, width)
\ty += 22
\tout << settings_choice('', if settings.language == .ru { desktop_tr('settings.region.russia') } else { desktop_tr('settings.region.us') }, settings_padding, y, inner, true)
\treturn out
}

'''
          if marker not in text:
              raise SystemExit('settings_app date_time marker missing')
          text = text.replace(marker, pane + marker, 1)
          handler = '''\tif event_id.starts_with(settings_action_language) {
\t\ta.desktop.settings.language = if event_id.ends_with('1') { SystemLanguage.ru } else { SystemLanguage.en }
\t\tdesktop_i18n_set_language(a.desktop.settings.language)
\t\treturn
\t}
'''
          text = text.replace("\tif event_id.starts_with(settings_action_clock_format) {\n", handler + "\tif event_id.starts_with(settings_action_clock_format) {\n", 1)
          p.write_text(text)

          # Do not translate user/document data that happens to equal an English UI string.
          p = Path('desktop/files.v')
          text = p.read_text()
          text = text.replace("ui2.label('', a.current_path(),", "ui2.label(desktop_i18n_raw_text_id, a.current_path(),", 1)
          text = text.replace("ui2.label('', entry.name,", "ui2.label(desktop_i18n_raw_text_id, entry.name,", 2)
          text = text.replace("ui2.label('', column_name,", "ui2.label(desktop_i18n_raw_text_id, column_name,", 1)
          text = text.replace("b.error = 'cannot open ${path}'", "b.error = '${desktop_tr('files.cannot_open')} ${path}'", 1)
          p.write_text(text)

          p = Path('desktop/editor.v')
          text = p.read_text()
          text = text.replace("frame_child(ui2.label('', editor_bytes_text(a.path),", "frame_child(ui2.label(desktop_i18n_raw_text_id, editor_bytes_text(a.path),", 1)
          text = text.replace("lines << ui2.label('', editor_slice_text(a.text, position, end - position),", "lines << ui2.label(desktop_i18n_raw_text_id, editor_slice_text(a.text, position, end - position),", 1)
          # Dynamic file statuses include a user path: translate only their fixed prefix.
          text = text.replace("editor_append(mut a.status, prefix)", "editor_append(mut a.status, desktop_i18n_text(prefix))", 1)
          p.write_text(text)

          p = Path('desktop/vspace.v')
          text = p.read_text()
          text = text.replace("ui2.label('', entry.name,", "ui2.label(desktop_i18n_raw_text_id, entry.name,", 1)
          text = text.replace("ui2.label('', entry.path,", "ui2.label(desktop_i18n_raw_text_id, entry.path,", 1)
          text = text.replace("ui2.label('', a.scanner.root,", "ui2.label(desktop_i18n_raw_text_id, a.scanner.root,", 1)
          p.write_text(text)

          p = Path('desktop/activity.v')
          text = p.read_text()
          # Built-in process names are interface names; arbitrary process names remain raw.
          for exe, key in [
              ('vinix-files','app.files'), ('vinix-calculator','app.calculator'), ('vinix-terminal','app.terminal'),
              ('vinix-settings','app.settings'), ('vinix-activity','app.activity'), ('vinix-vspace','app.vspace'),
              ('vinix-editor','app.editor'), ('vinix-calendar','app.calendar'), ('vinix-clock','app.clock'),
              ('vinix-capture','app.capture')]:
              text = text.replace(f"'{exe}' {{ '", f"'{exe}' {{ desktop_tr('{key}') // ", 0)
          # Replace the whole known-name mapper with keyed lookups if it still has its original shape.
          start = text.find('fn activity_process_name(')
          end = text.find('\n}\n', start)
          if start >= 0 and end >= 0:
              block = text[start:end+3]
              if "'vinix-files'" in block:
                  signature = block[:block.find('{')+1]
                  mapped = signature + r'''
\treturn match name {
\t\t'vinix-files' { desktop_tr('app.files') }
\t\t'vinix-calculator' { desktop_tr('app.calculator') }
\t\t'vinix-terminal' { desktop_tr('app.terminal') }
\t\t'vinix-settings' { desktop_tr('app.settings') }
\t\t'vinix-activity' { desktop_tr('app.activity') }
\t\t'vinix-vspace' { desktop_tr('app.vspace') }
\t\t'vinix-editor' { desktop_tr('app.editor') }
\t\t'vinix-calendar' { desktop_tr('app.calendar') }
\t\t'vinix-clock' { desktop_tr('app.clock') }
\t\t'vinix-capture' { desktop_tr('app.capture') }
\t\telse { name }
\t}
}
'''
                  text = text.replace(block, mapped, 1)
          text = text.replace("cells << ui2.label('', entry.name,", "cells << ui2.label(desktop_i18n_raw_text_id, entry.name,", 1)
          p.write_text(text)

          # Registration text fields contain user-entered data. Keep action_id for hit routing.
          p = Path('desktop/registration.v')
          text = p.read_text()
          old = '''\treturn ui2.Element{
\t\t...field
\t\tclickable: true
\t}
'''
          new = '''\treturn ui2.Element{
\t\t...field
\t\tid: desktop_i18n_raw_text_id
\t\taction_id: action
\t\tclickable: true
\t}
'''
          if old not in text:
              raise SystemExit('registration field return did not match')
          text = text.replace(old, new, 1)
          p.write_text(text)

          # Add the few language/clock values introduced by source-localized formatting.
          for name, values in {
              'en': {
                  'clock.am': 'AM', 'clock.pm': 'PM',
                  'settings.region.us': 'United States', 'settings.region.russia': 'Russia',
                  'files.cannot_open': 'cannot open'
              },
              'ru': {
                  'clock.am': 'ДП', 'clock.pm': 'ПП',
                  'settings.region.us': 'Соединённые Штаты', 'settings.region.russia': 'Россия',
                  'files.cannot_open': 'не удалось открыть'
              }
          }.items():
              path = Path(f'desktop/translations/{name}.json')
              data = json.loads(path.read_text())
              data.update(values)
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Build V and ui2
        run: |
          git clone https://github.com/vlang/v.git --depth=1 "$RUNNER_TEMP/v"
          make -C "$RUNNER_TEMP/v"
          git clone https://github.com/vlang/ui2 third_party/ui2

      - name: Run Settings tests
        run: V="$RUNNER_TEMP/v/v" ./desktop/tools/test-settings.sh

      - name: Run desktop utility tests
        run: V="$RUNNER_TEMP/v/v" ./desktop/tools/test-utilities.sh

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/desktop-i18n-bootstrap.yml
          git add desktop
          git diff --cached --check
          git commit -m "desktop: integrate system language across ui2 apps"
          git push origin HEAD:desktop-i18n-en-ru
