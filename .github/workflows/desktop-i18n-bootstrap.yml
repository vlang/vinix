name: Desktop i18n integration

on:
  push:
    branches:
      - desktop-i18n-en-ru
    paths:
      - '.github/workflows/desktop-i18n-bootstrap.yml'

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: desktop-i18n-en-ru
      - name: Apply integration patches
        run: |
          python3 desktop/tools/i18n_integrate.py
          sed -i "/SettingsCategory.settings/d" desktop/tools/tests/localization_test.v
      - name: Build V and ui2
        run: |
          git clone https://github.com/vlang/v.git --depth=1 "$RUNNER_TEMP/v"
          make -C "$RUNNER_TEMP/v"
          git clone https://github.com/vlang/ui2 third_party/ui2
      - name: Run Settings tests
        run: V="$RUNNER_TEMP/v/v" ./desktop/tools/test-settings.sh
      - name: Run desktop utility tests
        run: V="$RUNNER_TEMP/v/v" ./desktop/tools/test-utilities.sh
      - name: Save patched files
        uses: actions/upload-artifact@v4
        with:
          name: desktop-i18n-patched
          path: |
            desktop
            build-desktop-aarch64.sh
            build-desktop-amd64.sh
