name: V desktop port
on:
  push:
    branches: [work/v-only-desktop-backlight]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the upstream V bootstrap and fetch ui2
        run: |
          git clone --depth=1 https://github.com/vlang/v.git /tmp/vlang
          git clone --depth=1 https://github.com/vlang/vc.git /tmp/vlang/vc
          cc -std=gnu99 -w -o /tmp/vlang/v /tmp/vlang/vc/v.c -lm -lpthread
          mkdir -p third_party
          git clone --depth=1 https://github.com/vlang/ui2.git third_party/ui2
          /tmp/vlang/v version
          git -C /tmp/vlang rev-parse HEAD
          git -C /tmp/vlang/vc rev-parse HEAD
          git -C third_party/ui2 rev-parse HEAD
          printf 'fn main() { println("bootstrap OK") }\n' > /tmp/smoke.v
          /tmp/vlang/v -old-compiler -cc gcc -gc none run /tmp/smoke.v
      - name: Package offline validation workspace
        run: |
          mkdir -p /tmp/v-port-workspace
          git archive HEAD | tar -x -C /tmp/v-port-workspace
          mkdir -p /tmp/v-port-workspace/third_party
          cp -a third_party/ui2 /tmp/v-port-workspace/third_party/
          tar --exclude=.git -czf /tmp/v-port-workspace.tar.gz -C /tmp vlang v-port-workspace
      - uses: actions/upload-artifact@v4
        with:
          name: v-port-workspace
          path: /tmp/v-port-workspace.tar.gz
          retention-days: 1
