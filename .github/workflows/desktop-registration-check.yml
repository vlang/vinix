name: Desktop registration check

on:
  push:
    branches:
      - desktop/first-launch-registration

jobs:
  desktop-utilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build current V
        run: git clone https://github.com/vlang/v.git --depth=1 && cd v && make

      - name: Run desktop utility tests
        run: V="$GITHUB_WORKSPACE/v/v" ./desktop/tools/test-utilities.sh
