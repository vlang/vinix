name: M1 Wi-Fi kernel build
on:
  push:
    branches: [wifi/m1-air-build]
  pull_request:
    paths:
      - 'kernel/**'
      - 'tests/m1-wifi/**'
      - 'tools/m1-wifi/**'
      - '.github/workflows/m1-wifi-build.yml'
permissions:
  contents: read
concurrency:
  group: m1-wifi-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        id: uses_checkout_v6
        with:
          persist-credentials: false
      - name: Install build tools
        id: install_build_tools
        if: ${{ success() && !cancelled() && steps.uses_checkout_v6.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y clang lld gcc make git curl
      - name: Bootstrap pinned V compiler
        id: bootstrap_pinned_v_compiler
        if: ${{ success() && !cancelled() && steps.install_build_tools.outcome == 'success' }}
        run: sh tools/m1-wifi/get-v.sh /tmp/vinix-wifi-v
      - name: Compile native packaging and verification tools
        id: compile_native_packaging_and_verification_tools
        if: ${{ success() && !cancelled() && steps.bootstrap_pinned_v_compiler.outcome == 'success' }}
        shell: bash
        env:
          V_C_ERROR_BUG_REPORT_DISABLED: '1'
          V_MACOS_V3_NO_FALLBACK: '1'
        run: |
          set -euo pipefail
          mkdir -p tests/m1-wifi/out/native-tools
          /tmp/vinix-wifi-v/v -nocache -cc clang -o tests/m1-wifi/out/native-tools/package tools/m1-wifi/package.v
          /tmp/vinix-wifi-v/v -nocache -cc clang -o tests/m1-wifi/out/native-tools/verify-build tests/m1-wifi/verify-build.v
          /tmp/vinix-wifi-v/v -nocache -cc clang -o tests/m1-wifi/out/native-tools/verify-test tests/m1-wifi/verify-test.v
      - name: Driver sanitizer and optimized tests
        id: driver_sanitizer_and_optimized_tests
        if: ${{ success() && !cancelled() && steps.compile_native_packaging_and_verification_tools.outcome == 'success' }}
        shell: bash
        env:
          V: /tmp/vinix-wifi-v/v
        run: |
          set -euo pipefail
          mkdir -p tests/m1-wifi/out
          CC=clang SANITIZE=1 sh tests/m1-wifi/run.sh | tee tests/m1-wifi/out/wifi-sanitizers.log
          CC=gcc SANITIZE=0 sh tests/m1-wifi/run.sh | tee tests/m1-wifi/out/wifi-gcc.log
          CC=clang sh tests/apple-spi-keyboard/run.sh | tee tests/m1-wifi/out/keyboard.log
          clang -std=c11 -O2 -Wall -Wextra -Werror -iquote kernel/c tools/m1-wifi/wifi-ctl.c -o tests/m1-wifi/out/wifi-ctl-host
      - name: Fetch pinned kernel dependencies
        id: fetch_pinned_kernel_dependencies
        if: ${{ success() && !cancelled() && steps.driver_sanitizer_and_optimized_tests.outcome == 'success' }}
        run: cd kernel && ./get-deps
      - name: Clean debug and production ARM64 links
        id: clean_debug_and_production_arm64_links
        if: ${{ success() && !cancelled() && steps.fetch_pinned_kernel_dependencies.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          V=/tmp/vinix-wifi-v/v JOBS=2 sh tests/m1-wifi/build.sh 2>&1 | tee tests/m1-wifi/out/build-acceptance.log
      - name: Record source identity
        if: always()
        run: |
          mkdir -p tests/m1-wifi/out
          git rev-parse HEAD > tests/m1-wifi/out/SOURCE_COMMIT
          git rev-parse 'HEAD:kernel' > tests/m1-wifi/out/KERNEL_TREE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: m1-wifi-kernel-build
          path: tests/m1-wifi/out/
          retention-days: 7
          if-no-files-found: error
