name: Wi-Fi validation tools
on:
  push:
    branches: [wifi/m1-air]
    paths: ['.github/workflows/wifi-dependencies.yml']
permissions:
  contents: read
jobs:
  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 77f018d956ab09c3d6628bb5ac7ac664b9ab48df
          persist-credentials: false
      - name: Snapshot current master
        run: git archive --format=tar HEAD | gzip > /tmp/vinix-master.tar.gz
      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Build static musl toolchain inputs
        run: |
          cd /tmp
          curl -fL --retry 3 -o musl.tar.gz https://musl.libc.org/releases/musl-1.2.5.tar.gz
          tar xf musl.tar.gz
          cd musl-1.2.5
          CC=aarch64-linux-gnu-gcc ./configure --prefix=/usr --target=aarch64 --disable-shared
          make -j2
          make DESTDIR=/tmp/musl-root install
          cp "$(aarch64-linux-gnu-gcc -print-libgcc-file-name)" /tmp/musl-root/usr/lib/
          tar -C /tmp -czf /tmp/musl-root.tar.gz musl-root
      - uses: actions/upload-artifact@v7
        with:
          name: wifi-master-and-musl
          path: |
            /tmp/vinix-master.tar.gz
            /tmp/musl-root.tar.gz
          retention-days: 3
